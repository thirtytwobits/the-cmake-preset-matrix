name: CI
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    name: 🧪 run unit tests
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
    - name: 🐍 Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: |
          3.10
          3.11
          3.12
          3.13
          3.14
        cache: pip
    - name: ⬇️ Install tox
      run: python -m pip install tox
    - name: 🧪 lint
      run: tox run -e lint
    - name: 🧪 test
      run: tox run-parallel
    - name: 📄 Build docs
      run: tox run -e docs
    - name: 📉 report
      run: tox run -e report
    - name: ⬆️ upload-coverage-reports
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-reports
        path: .tox/report/tmp/*
    - name: ⬆️ upload-xunit-results
      uses: actions/upload-artifact@v7.0.2
      with:
        name: xunit-results
        path: .tox/py*-test/tmp/xunit-result.xml
        include-hidden-files: true
        if-no-files-found: error
  build:
    name: 🔨 Build distribution
    if: startsWith(github.ref, 'refs/tags/')
    needs:
    - validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: 🐍 Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.x"
    - name: ⬇️ Install tox
      run: >-
        python3 -m
        pip install
        tox
        --user
    - name: ⬇️ Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: 🔨 Build a binary wheel and a source tarball
      # Fails the release if the internal version doesn't match the ref provided here
      run: tox run -e checked_build -- --tag=${{ github.ref }}
    - name: ⬆️ Store the distribution packages
      uses: actions/upload-artifact@v7.0.2
      with:
        name: python-package-distributions
        path: dist/
  publish-to-pypi:
    name: >-
      ⬆️ Publish tcpm ⊹ distribution 📦 to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tcpm
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: ⬇️ Download all the dists
      uses: actions/download-artifact@v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: ⬆️ Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.2
  github-release:
    name: >-
      ✍️ Sign tcpm ⊹ 📦 with Sigstore and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: ⬇️ Download all the dists
      uses: actions/download-artifact@v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: ✍️ Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: 🤘 Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        "$GITHUB_REF_NAME.signed"
        --repo "$GITHUB_REPOSITORY"
        --notes ""
    - name: ⬆️ Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        "$GITHUB_REF_NAME.signed" dist/**
        --repo "$GITHUB_REPOSITORY"
